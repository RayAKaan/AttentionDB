[package]
name = "phase3-bench"
version = "0.1.0"
edition = "2021"
description = "Phase 3: real-world validation benchmarks for the frozen Phase 2 architecture"
publish = false

[dependencies]
libc = "0.2"
attentiondb-core = { path = "../../core" }
attentiondb-storage = { path = "../../storage" }
attentiondb-learned = { path = "../../learned" }
attentiondb-query = { path = "../../query" }
uuid = { version = "1.7", features = ["v4"] }
phase2b-bench = { path = "../phase2b" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
