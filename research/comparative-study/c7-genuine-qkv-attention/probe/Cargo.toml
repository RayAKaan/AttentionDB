[package]
name = "c7pilot"
version = "0.1.0"
edition = "2021"
description = "C7 genuine candidate-level Q/K/V attention pilot — drives the C7 engine via config JSON"

[workspace]

[dependencies]
attentiondb-core = { path = "../../../../core" }
attentiondb-storage = { path = "../../../../storage" }
attentiondb-attention = { path = "../../../../attention" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
rand = { version = "0.8", features = ["small_rng"] }

[[bin]]
name = "c7pilot"
path = "src/main.rs"

# C7 §8 gate #6: redirect hnsw_rs to the vendored copy with a fixed
# layer-RNG seed so index builds are bit-identical across processes.
[patch.crates-io]
hnsw_rs = { path = "../../../../vendor/hnsw_rs" }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
panic = "abort"
debug = false