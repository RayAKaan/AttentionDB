[package]
name = "c6pilot"
version = "0.1.0"
edition = "2021"
description = "C6 adaptive retrieval pilot — drives the C6 engine via config JSON"

[workspace]

[dependencies]
attentiondb-core = { path = "../../../../core" }
attentiondb-storage = { path = "../../../../storage" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
rand = { version = "0.8", features = ["small_rng"] }

[[bin]]
name = "c6pilot"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
panic = "abort"
debug = false